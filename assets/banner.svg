<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e2a44" stroke-width="1" opacity="0.5">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- decorative candlesticks (right side) -->
  <g opacity="0.9">
    <!-- up candle -->
    <line x1="720" y1="380" x2="720" y2="470" stroke="#34d399" stroke-width="3"/>
    <rect x="708" y="400" width="24" height="55" rx="3" fill="#34d399"/>
    <!-- down candle -->
    <line x1="775" y1="350" x2="775" y2="450" stroke="#f87171" stroke-width="3"/>
    <rect x="763" y="375" width="24" height="55" rx="3" fill="#f87171"/>
    <!-- up candle -->
    <line x1="830" y1="300" x2="830" y2="420" stroke="#34d399" stroke-width="3"/>
    <rect x="818" y="325" width="24" height="70" rx="3" fill="#34d399"/>
    <!-- up candle -->
    <line x1="885" y1="250" x2="885" y2="390" stroke="#34d399" stroke-width="3"/>
    <rect x="873" y="275" width="24" height="85" rx="3" fill="#34d399"/>
    <!-- down candle -->
    <line x1="940" y1="230" x2="940" y2="340" stroke="#f87171" stroke-width="3"/>
    <rect x="928" y="250" width="24" height="55" rx="3" fill="#f87171"/>
    <!-- up candle -->
    <line x1="995" y1="180" x2="995" y2="300" stroke="#34d399" stroke-width="3"/>
    <rect x="983" y="200" width="24" height="80" rx="3" fill="#34d399"/>
    <!-- up candle -->
    <line x1="1050" y1="140" x2="1050" y2="250" stroke="#34d399" stroke-width="3"/>
    <rect x="1038" y="160" width="24" height="70" rx="3" fill="#34d399"/>
  </g>

  <!-- trend line over candles -->
  <polyline points="712,430 767,405 822,360 877,315 932,285 987,235 1042,190"
            fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"
            stroke-linejoin="round" filter="url(#glow)" opacity="0.95"/>

  <!-- MCP node badge -->
  <g transform="translate(96,150)">
    <circle cx="34" cy="34" r="34" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="34" cy="34" r="7" fill="url(#accent)"/>
    <circle cx="34" cy="6" r="5" fill="#22d3ee"/>
    <circle cx="58" cy="48" r="5" fill="#34d399"/>
    <circle cx="10" cy="48" r="5" fill="#22d3ee"/>
    <line x1="34" y1="34" x2="34" y2="6" stroke="url(#accent)" stroke-width="2.5"/>
    <line x1="34" y1="34" x2="58" y2="48" stroke="url(#accent)" stroke-width="2.5"/>
    <line x1="34" y1="34" x2="10" y2="48" stroke="url(#accent)" stroke-width="2.5"/>
  </g>

  <!-- eyebrow -->
  <text x="188" y="178" fill="#22d3ee" font-size="22" font-weight="600" letter-spacing="4">MODEL CONTEXT PROTOCOL · PYTHON</text>

  <!-- title -->
  <text x="96" y="290" fill="#ffffff" font-size="82" font-weight="800" letter-spacing="-1">Stock Research</text>
  <text x="96" y="378" fill="url(#accent)" font-size="82" font-weight="800" letter-spacing="-1">MCP Server</text>

  <!-- subtitle -->
  <text x="98" y="440" fill="#aab6cf" font-size="27" font-weight="400">Live market data &amp; portfolio analysis for any AI assistant.</text>

  <!-- tool chips -->
  <g font-size="20" font-weight="600">
    <g>
      <rect x="96" y="480" width="150" height="44" rx="22" fill="#132038" stroke="#2a3a5c"/>
      <text x="171" y="508" fill="#cfe9ff" text-anchor="middle">Live Quotes</text>
    </g>
    <g>
      <rect x="262" y="480" width="172" height="44" rx="22" fill="#132038" stroke="#2a3a5c"/>
      <text x="348" y="508" fill="#cfe9ff" text-anchor="middle">Fundamentals</text>
    </g>
    <g>
      <rect x="450" y="480" width="196" height="44" rx="22" fill="#132038" stroke="#2a3a5c"/>
      <text x="548" y="508" fill="#cfe9ff" text-anchor="middle">Portfolio P&amp;L</text>
    </g>
    <g>
      <rect x="662" y="480" width="150" height="44" rx="22" fill="#132038" stroke="#2a3a5c"/>
      <text x="737" y="508" fill="#cfe9ff" text-anchor="middle">News</text>
    </g>
  </g>

  <!-- footer stack -->
  <text x="96" y="575" fill="#6b7a99" font-size="19" font-weight="500">FastMCP · yfinance · Streamable HTTP · Deployed on Render</text>
</svg>
